# Validates markdown frontmatter and makes sure the site builds.
# Deploys themselves are handled by Vercel's GitHub integration:
# every push to main -> Vercel builds -> the site refreshes.
name: Check content

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
